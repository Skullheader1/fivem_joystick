<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- 明确允许本地 WebSocket 与 NUI 回调 (新版 FiveM/CEF 的 CSP 更严格) -->
    <!-- Explicitly allow the local WebSocket + NUI callbacks; newer FiveM/CEF enforce a stricter CSP. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self' 'unsafe-inline' 'unsafe-eval';
                   connect-src 'self' https://joystick http://localhost:11556 http://127.0.0.1:11556 ws://localhost:11556 ws://127.0.0.1:11556;">
    <title>摇杆R轴控制</title>
    <style>
        .slider-container {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 5px;
            border-radius: 5px;
            display: none;
        }
        #rAxisSlider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 150px;
        }
    </style>
</head>
<body>
    <div class="slider-container" id="sliderContainer">
        <input type="range" id="rAxisSlider" min="-1" max="1" step="0.01" value="0">
    </div>
    <script src="script.js"></script>
</body>
</html>
